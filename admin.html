<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
    }

    .header {
      background-color: #67a9e4;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 3px solid #3d73c9;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 76px);
    }

    .sidebar {
      width: 220px;
      background-color: #3d73c9;
      padding: 20px;
      color: white;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      background-color: white;
      color: #3d73c9;
      font-weight: bold;
      cursor: pointer;
    }

    .sidebar button:hover {
      background-color: #dce8ff;
    }

    .main {
      flex: 1;
      padding: 25px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-buttons button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background-color: #3d73c9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .top-buttons button:hover {
      background-color: #2b5dad;
    }

    .card {
      background-color: white;
      border: 2px solid #9ccc65;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      background-color: #3d73c9;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #2b5dad;
    }

    .posts-container {
      display: grid;
      gap: 15px;
    }

    .post {
      background-color: #eef4ff;
      border-left: 6px solid #3d73c9;
      padding: 15px;
      border-radius: 8px;
    }

    .post h3 {
      margin-bottom: 8px;
    }

    .post p {
      margin-bottom: 8px;
    }

    .hidden {
      display: none;
    }

    .empty-message {
      color: #666;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="header">Admin Page</div>

  <div class="container">
    <div class="sidebar">
      <h2>Menu</h2>
      <button onclick="showSection('createSection')">Create Post</button>
      <button onclick="showYourPosts()">Your Posts</button>
      <button onclick="showTeamPosts()">Team Posts</button>
    </div>

    <div class="main">
      <div class="top-buttons">
        <button onclick="editSelectedPost()">Edit</button>
        <button onclick="deleteSelectedPost()">Delete</button>
      </div>

      <div id="createSection" class="card">
        <h2>Create Post</h2>
        <form id="postForm">
          <div class="form-group">
            <label for="postTitle">Post Title</label>
            <input type="text" id="postTitle" required>
          </div>

          <div class="form-group">
            <label for="postRole">Who is posting?</label>
            <select id="postRole" required>
              <option value="">Select role</option>
              <option value="Admin">Admin</option>
              <option value="Player">Player</option>
            </select>
          </div>

          <div class="form-group">
            <label for="postContent">Post Message</label>
            <textarea id="postContent" required></textarea>
          </div>

          <input type="hidden" id="editIndex" value="">
          <button type="submit" class="submit-btn">Post</button>
        </form>
      </div>

      <div id="postsSection" class="card">
        <h2 id="sectionTitle">Team Posts</h2>
        <div id="postsContainer" class="posts-container"></div>
      </div>
    </div>
  </div>

  <script>
    const adminName = "Maria Perez";
    let selectedPostIndex = null;
    let currentView = "team";

    const samplePosts = [
      {
        title: "Practice Reminder",
        role: "Player",
        content: "Practice starts at 5 PM tomorrow.",
        author: "Player 1"
      },
      {
        title: "Game Update",
        role: "Admin",
        content: "The game was moved to Saturday.",
        author: "Admin Team"
      }
    ];

    if (!localStorage.getItem("teamPosts")) {
      localStorage.setItem("teamPosts", JSON.stringify(samplePosts));
    }

    const postForm = document.getElementById("postForm");
    const postTitle = document.getElementById("postTitle");
    const postRole = document.getElementById("postRole");
    const postContent = document.getElementById("postContent");
    const editIndex = document.getElementById("editIndex");
    const postsContainer = document.getElementById("postsContainer");
    const sectionTitle = document.getElementById("sectionTitle");

    function getPosts() {
      return JSON.parse(localStorage.getItem("teamPosts")) || [];
    }

    function savePosts(posts) {
      localStorage.setItem("teamPosts", JSON.stringify(posts));
    }

    function renderPosts(postsArray, originalIndexes) {
      postsContainer.innerHTML = "";

      if (postsArray.length === 0) {
        postsContainer.innerHTML = `<p class="empty-message">No posts to show.</p>`;
        selectedPostIndex = null;
        return;
      }

      postsArray.forEach((post, i) => {
        const realIndex = originalIndexes[i];

        const postDiv = document.createElement("div");
        postDiv.classList.add("post");

        if (selectedPostIndex === realIndex) {
          postDiv.style.outline = "3px solid orange";
        }

        postDiv.innerHTML = `
          <h3>${post.title}</h3>
          <p><strong>Role:</strong> ${post.role}</p>
          <p><strong>Posted by:</strong> ${post.author}</p>
          <p>${post.content}</p>
        `;

        postDiv.onclick = function () {
          selectedPostIndex = realIndex;
          refreshCurrentView();
        };

        postsContainer.appendChild(postDiv);
      });
    }

    function showSection(sectionId) {
      document.getElementById("createSection").classList.add("hidden");
      document.getElementById("postsSection").classList.add("hidden");
      document.getElementById(sectionId).classList.remove("hidden");
    }

    function showTeamPosts() {
      currentView = "team";
      const posts = getPosts();
      const indexes = posts.map((_, index) => index);
      sectionTitle.textContent = "Team Posts";
      showSection("postsSection");
      renderPosts(posts, indexes);
    }

    function showYourPosts() {
      currentView = "your";
      const posts = getPosts();
      const filteredPosts = [];
      const indexes = [];

      posts.forEach((post, index) => {
        if (post.author === adminName) {
          filteredPosts.push(post);
          indexes.push(index);
        }
      });

      sectionTitle.textContent = "Your Posts";
      showSection("postsSection");
      renderPosts(filteredPosts, indexes);
    }

    function refreshCurrentView() {
      if (currentView === "your") {
        showYourPosts();
      } else {
        showTeamPosts();
      }
    }

    postForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const posts = getPosts();

      const newPost = {
        title: postTitle.value,
        role: postRole.value,
        content: postContent.value,
        author: adminName
      };

      if (editIndex.value === "") {
        posts.push(newPost);
      } else {
        posts[editIndex.value] = newPost;
      }

      savePosts(posts);
      clearForm();
      showTeamPosts();
    });

    function editSelectedPost() {
      if (selectedPostIndex === null) {
        alert("Please click a post first to edit it.");
        return;
      }

      const posts = getPosts();
      const post = posts[selectedPostIndex];

      postTitle.value = post.title;
      postRole.value = post.role;
      postContent.value = post.content;
      editIndex.value = selectedPostIndex;

      showSection("createSection");
    }

    function deleteSelectedPost() {
      if (selectedPostIndex === null) {
        alert("Please click a post first to delete it.");
        return;
      }

      const posts = getPosts();
      posts.splice(selectedPostIndex, 1);
      savePosts(posts);
      selectedPostIndex = null;
      refreshCurrentView();
    }

    function clearForm() {
      postForm.reset();
      editIndex.value = "";
    }

    showTeamPosts();
  </script>

</body>
</html>
