<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
    }

    .header {
      background-color: #67a9e4;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 3px solid #3d73c9;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 76px);
    }

    .sidebar {
      width: 220px;
      background-color: #3d73c9;
      padding: 20px;
      color: white;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      background-color: white;
      color: #3d73c9;
      font-weight: bold;
      cursor: pointer;
    }

    .sidebar button:hover {
      background-color: #dce8ff;
    }

    .main {
      flex: 1;
      padding: 25px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .top-buttons button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background-color: #3d73c9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .top-buttons button:hover {
      background-color: #2b5dad;
    }

    .card {
      background-color: white;
      border: 2px solid #9ccc65;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      background-color: #3d73c9;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #2b5dad;
    }

    .posts-container {
      display: grid;
      gap: 15px;
    }

    .post {
      background-color: #eef4ff;
      border-left: 6px solid #3d73c9;
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .post.selected {
      outline: 3px solid orange;
    }

    .post-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #111;
    }

    .post-username {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .post-message {
      font-size: 16px;
      line-height: 1.5;
      color: #222;
      margin-bottom: 12px;
    }

    .post-actions {
      margin-top: 10px;
    }

    .respond-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background-color: #3d73c9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .respond-btn:hover {
      background-color: #2b5dad;
    }

    .response-box {
      margin-top: 12px;
    }

    .response-box textarea {
      min-height: 70px;
      margin-bottom: 8px;
    }

    .response-submit {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background-color: green;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .responses {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #c8d7f5;
    }

    .response-item {
      background-color: #ffffff;
      border-left: 4px solid #9ccc65;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .response-user {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .profile-box p {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    .empty-message {
      color: #666;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="header">Admin Page</div>

  <div class="container">
    <div class="sidebar">
      <h2>Menu</h2>
      <button onclick="showProfile()">Profile</button>
      <button onclick="showYourPosts()">Your Posts</button>
      <button onclick="showTeamPosts()">Team Posts</button>
    </div>

    <div class="main">
      <div class="top-buttons">
        <button onclick="showCreate()">Create</button>
        <button onclick="showDashboard()">Dashboard</button>
        <button onclick="editSelectedPost()">Edit</button>
        <button onclick="deleteSelectedPost()">Delete</button>
      </div>

      <div id="profileSection" class="card hidden">
        <h2>Profile</h2>
        <div class="profile-box">
          <p><strong>Name:</strong> Maria Perez</p>
          <p><strong>Username:</strong> @mariaperez</p>
          <p><strong>Role:</strong> Admin</p>
        </div>
      </div>

      <div id="createSection" class="card hidden">
        <h2>Create Post</h2>
        <form id="postForm">
          <div class="form-group">
            <label for="postTitle">Post Title</label>
            <input type="text" id="postTitle" placeholder="Enter post title" required>
          </div>

          <div class="form-group">
            <label>Username</label>
            <input type="text" id="displayUsername" readonly>
          </div>

          <div class="form-group">
            <label for="postMessage">Message</label>
            <textarea id="postMessage" placeholder="Type your message here..." required></textarea>
          </div>

          <input type="hidden" id="editIndex" value="">
          <button type="submit" class="submit-btn">Post</button>
        </form>
      </div>

      <div id="postsSection" class="card">
        <h2 id="sectionTitle">Dashboard</h2>
        <div id="postsContainer" class="posts-container"></div>
      </div>
    </div>
  </div>

  <script>
    const adminName = "Maria Perez";
    const adminUsername = "mariaperez";

    let selectedPostIndex = null;
    let currentView = "dashboard";

    const samplePosts = [
      {
        title: "Practice Reminder",
        username: "player1",
        message: "Practice starts at 5 PM tomorrow.",
        responses: [
          { username: "coachalex", message: "Thanks for the reminder." }
        ]
      },
      {
        title: "Game Update",
        username: "mariaperez",
        message: "The game has been moved to Saturday.",
        responses: []
      }
    ];

    if (!localStorage.getItem("teamPosts")) {
      localStorage.setItem("teamPosts", JSON.stringify(samplePosts));
    }

    const postForm = document.getElementById("postForm");
    const postTitle = document.getElementById("postTitle");
    const displayUsername = document.getElementById("displayUsername");
    const postMessage = document.getElementById("postMessage");
    const editIndex = document.getElementById("editIndex");
    const postsContainer = document.getElementById("postsContainer");
    const sectionTitle = document.getElementById("sectionTitle");

    displayUsername.value = "@" + adminUsername;

    function getPosts() {
      return JSON.parse(localStorage.getItem("teamPosts")) || [];
    }

    function savePosts(posts) {
      localStorage.setItem("teamPosts", JSON.stringify(posts));
    }

    function hideAllSections() {
      document.getElementById("profileSection").classList.add("hidden");
      document.getElementById("createSection").classList.add("hidden");
      document.getElementById("postsSection").classList.add("hidden");
    }

    function renderPosts(postsArray, originalIndexes) {
      postsContainer.innerHTML = "";

      if (postsArray.length === 0) {
        postsContainer.innerHTML = `<p class="empty-message">No posts to show.</p>`;
        selectedPostIndex = null;
        return;
      }

      postsArray.forEach((post, i) => {
        const realIndex = originalIndexes[i];
        const postDiv = document.createElement("div");
        postDiv.className = "post";

        if (selectedPostIndex === realIndex) {
          postDiv.classList.add("selected");
        }

        let responsesHTML = "";
        if (post.responses && post.responses.length > 0) {
          responsesHTML = `
            <div class="responses">
              ${post.responses.map(response => `
                <div class="response-item">
                  <div class="response-user">@${response.username}</div>
                  <div>${response.message}</div>
                </div>
              `).join("")}
            </div>
          `;
        }

        postDiv.innerHTML = `
          <div class="post-title">${post.title}</div>
          <div class="post-username">@${post.username}</div>
          <div class="post-message">${post.message}</div>

          <div class="post-actions">
            <button class="respond-btn" onclick="toggleResponseBox(event, ${realIndex})">Respond</button>
          </div>

          <div class="response-box hidden" id="responseBox-${realIndex}">
            <textarea id="responseText-${realIndex}" placeholder="Write your response here..."></textarea>
            <button class="response-submit" onclick="addResponse(event, ${realIndex})">Post Response</button>
          </div>

          ${responsesHTML}
        `;

        postDiv.onclick = function () {
          selectedPostIndex = realIndex;
          refreshCurrentView();
        };

        postsContainer.appendChild(postDiv);
      });
    }

    function showProfile() {
      currentView = "profile";
      hideAllSections();
      document.getElementById("profileSection").classList.remove("hidden");
    }

    function showCreate() {
      currentView = "create";
      hideAllSections();
      document.getElementById("createSection").classList.remove("hidden");
    }

    function showDashboard() {
      currentView = "dashboard";
      const posts = getPosts();
      const indexes = posts.map((_, index) => index);
      sectionTitle.textContent = "Dashboard";
      hideAllSections();
      document.getElementById("postsSection").classList.remove("hidden");
      renderPosts(posts, indexes);
    }

    function showTeamPosts() {
      currentView = "team";
      const posts = getPosts();
      const filteredPosts = [];
      const indexes = [];

      posts.forEach((post, index) => {
        if (post.username !== adminUsername) {
          filteredPosts.push(post);
          indexes.push(index);
        }
      });

      sectionTitle.textContent = "Team Posts";
      hideAllSections();
      document.getElementById("postsSection").classList.remove("hidden");
      renderPosts(filteredPosts, indexes);
    }

    function showYourPosts() {
      currentView = "your";
      const posts = getPosts();
      const filteredPosts = [];
      const indexes = [];

      posts.forEach((post, index) => {
        if (post.username === adminUsername) {
          filteredPosts.push(post);
          indexes.push(index);
        }
      });

      sectionTitle.textContent = "Your Posts";
      hideAllSections();
      document.getElementById("postsSection").classList.remove("hidden");
      renderPosts(filteredPosts, indexes);
    }

    function refreshCurrentView() {
      if (currentView === "your") {
        showYourPosts();
      } else if (currentView === "team") {
        showTeamPosts();
      } else {
        showDashboard();
      }
    }

    postForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const posts = getPosts();

      const newPost = {
        title: postTitle.value,
        username: adminUsername,
        message: postMessage.value,
        responses: []
      };

      if (editIndex.value === "") {
        posts.push(newPost);
      } else {
        posts[editIndex.value] = {
          ...posts[editIndex.value],
          title: postTitle.value,
          username: adminUsername,
          message: postMessage.value
        };
      }

      savePosts(posts);
      clearForm();
      showDashboard();
    });

    function editSelectedPost() {
      if (selectedPostIndex === null) {
        alert("Please click a post first to edit it.");
        return;
      }

      const posts = getPosts();
      const post = posts[selectedPostIndex];

      postTitle.value = post.title;
      postMessage.value = post.message;
      displayUsername.value = "@" + post.username;
      editIndex.value = selectedPostIndex;

      showCreate();
    }

    function deleteSelectedPost() {
      if (selectedPostIndex === null) {
        alert("Please click a post first to delete it.");
        return;
      }

      const posts = getPosts();
      posts.splice(selectedPostIndex, 1);
      savePosts(posts);
      selectedPostIndex = null;
      refreshCurrentView();
    }

    function toggleResponseBox(event, index) {
      event.stopPropagation();
      const box = document.getElementById(`responseBox-${index}`);
      box.classList.toggle("hidden");
    }

    function addResponse(event, index) {
      event.stopPropagation();

      const responseInput = document.getElementById(`responseText-${index}`);
      const responseText = responseInput.value.trim();

      if (responseText === "") {
        alert("Please write a response first.");
        return;
      }

      const posts = getPosts();

      if (!posts[index].responses) {
        posts[index].responses = [];
      }

      posts[index].responses.push({
        username: adminUsername,
        message: responseText
      });

      savePosts(posts);
      refreshCurrentView();
    }

    function clearForm() {
      postForm.reset();
      displayUsername.value = "@" + adminUsername;
      editIndex.value = "";
    }

    showDashboard();
  </script>

</body>
</html>
